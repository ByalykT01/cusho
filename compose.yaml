services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    ports:
      - "4317:18889"
      - "18888:18888"
    networks:
      - backend
    stdin_open: true
    tty: true
  cusho:
    image: cusho
    build:
      context: ./cusho-backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    env_file:
      - ./cusho-backend/.env
      - .env
    ports:
      - "8080:8080"
    networks:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    env_file:
      - .env
    ports:
      - "8081:8080"
    networks:
      - backend
    command: start-dev

  postgres:
    image: postgres:latest
    container_name: cusho_dev
    volumes:
      - ./cusho-backend/seed.sql:/docker-entrypoint-initdb.d/seed.sql
      - data_sql:/var/lib/postgresql/data
    env_file:
      - .env
    ports:
      - "5555:5432"
    networks:
      - backend
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U user -d cusho_dev -h localhost -p 5432"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s

networks:
  backend:
    driver: bridge

volumes:
  data_sql:
